<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hi sheryl :)</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d0d2b 0%, #1a1040 40%, #2d1b69 70%, #1a0533 100%);
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f0e6ff;
    }

    /* Stars */
    .stars-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle var(--dur) ease-in-out infinite var(--delay);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    /* Floating hearts */
    .hearts-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -40px;
      font-size: 1.2rem;
      opacity: 0;
      animation: floatUp var(--dur) ease-in infinite var(--delay);
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) rotate(0deg); }
      10% { opacity: 0.6; }
      90% { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-100vh) rotate(20deg); }
    }

    /* Moon */
    .moon {
      position: fixed;
      top: 40px;
      right: 80px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff9c4, #ffd966, #ffb347);
      box-shadow: 0 0 30px 10px rgba(255, 220, 80, 0.3), 0 0 80px 20px rgba(255, 200, 50, 0.15);
      animation: moonGlow 4s ease-in-out infinite;
      z-index: 1;
    }

    .moon::before {
      content: '';
      position: absolute;
      top: 8px; left: 12px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(255,180,60,0.35);
    }

    .moon::after {
      content: '';
      position: absolute;
      top: 30px; left: 30px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,180,60,0.25);
    }

    @keyframes moonGlow {
      0%, 100% { box-shadow: 0 0 30px 10px rgba(255,220,80,0.3), 0 0 80px 20px rgba(255,200,50,0.15); }
      50% { box-shadow: 0 0 45px 18px rgba(255,220,80,0.45), 0 0 110px 30px rgba(255,200,50,0.22); }
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 60px 70px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 32px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      max-width: 600px;
      width: 90%;
      animation: fadeInUp 1.2s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .greeting-small {
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c8a8f0;
      margin-bottom: 18px;
      opacity: 0.85;
    }

    .greeting-main {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 600;
      line-height: 1.3;
      color: #f5eeff;
      text-shadow: 0 0 40px rgba(200, 150, 255, 0.4);
      margin-bottom: 10px;
    }

    .greeting-main em {
      font-style: italic;
      color: #e8d0ff;
    }

    .divider {
      margin: 28px auto;
      width: 60px;
      height: 2px;
      background: linear-gradient(to right, transparent, #b67fff, transparent);
      border-radius: 2px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #c0a0e0;
      margin-bottom: 40px;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 14px 40px;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      transition: opacity 0.2s;
      border-radius: 50px;
    }

    .btn:hover::after { opacity: 0.06; }
    .btn:hover { transform: translateY(-3px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: linear-gradient(135deg, #9b59ff, #c678f5, #ff7eb3);
      color: white;
      box-shadow: 0 4px 20px rgba(155, 89, 255, 0.4);
    }

    .btn-primary:hover {
      box-shadow: 0 8px 30px rgba(155, 89, 255, 0.6);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.07);
      color: #e8d0ff;
      border: 1px solid rgba(200, 160, 255, 0.35);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .btn-icon { margin-right: 8px; font-size: 1.05em; }

    .footer-note {
      position: fixed;
      bottom: 24px;
      font-size: 0.75rem;
      color: rgba(200,160,255,0.4);
      letter-spacing: 0.1em;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="stars-container" id="stars"></div>
  <div class="hearts-container" id="hearts"></div>
  <div class="moon"></div>

  <div class="card">
    <p class="greeting-small">✦ a little something ✦</p>
    <h1 class="greeting-main">Hi Sheryl,<br><em>I hope you're sleeping well.</em></h1>
    <div class="divider"></div>
    <p class="subtitle">just wanted you to know i was thinking of you</p>

    <div class="buttons">
      <a href="reasons.html" class="btn btn-primary">
        <span class="btn-icon">🩷</span> 100 reasons why I like you
      </a>
      <a href="letter.html" class="btn btn-secondary">
        <span class="btn-icon">✉️</span> a little note for you
      </a>
    </div>
  </div>

  <p class="footer-note">made with a lot of care ✦</p>

  <script>
    // Generate stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = `
        width: ${size}px; height: ${size}px;
        top: ${Math.random() * 100}%; left: ${Math.random() * 100}%;
        --dur: ${Math.random() * 3 + 2}s;
        --delay: ${Math.random() * 4}s;
      `;
      starsEl.appendChild(s);
    }

    // Generate floating hearts
    const heartsEl = document.getElementById('hearts');
    const heartChars = ['🩷', '✦', '🌙', '⋆', '˚'];
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
      h.style.cssText = `
        left: ${Math.random() * 100}%;
        font-size: ${Math.random() * 0.8 + 0.7}rem;
        --dur: ${Math.random() * 8 + 10}s;
        --delay: ${Math.random() * 12}s;
      `;
      heartsEl.appendChild(h);
    }
  </script>
</body>
</html>
