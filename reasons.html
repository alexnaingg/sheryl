<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100 reasons ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d0d2b 0%, #1a1040 40%, #2d1b69 70%, #1a0533 100%);
      font-family: 'Nunito', sans-serif;
      color: #f0e6ff;
      padding: 40px 20px 80px;
    }

    .stars-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle var(--dur) ease-in-out infinite var(--delay);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.4); }
    }

    .back-btn {
      position: fixed;
      top: 24px; left: 24px;
      z-index: 10;
      text-decoration: none;
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      color: rgba(200,160,255,0.7);
      letter-spacing: 0.08em;
      padding: 8px 16px;
      border: 1px solid rgba(200,160,255,0.2);
      border-radius: 50px;
      backdrop-filter: blur(6px);
      background: rgba(255,255,255,0.04);
      transition: all 0.2s;
    }

    .back-btn:hover {
      color: #e8d0ff;
      border-color: rgba(200,160,255,0.5);
      background: rgba(255,255,255,0.08);
    }

    .header {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInUp 0.8s ease both;
    }

    .header-label {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c8a8f0;
      margin-bottom: 12px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 600;
      color: #f5eeff;
      text-shadow: 0 0 40px rgba(200,150,255,0.4);
    }

    .header h1 em {
      font-style: italic;
      color: #e8d0ff;
    }

    .header-sub {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #a07ec0;
      font-weight: 300;
    }

    .divider {
      margin: 20px auto 0;
      width: 50px;
      height: 2px;
      background: linear-gradient(to right, transparent, #b67fff, transparent);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .grid {
      position: relative;
      z-index: 2;
      max-width: 860px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .reason-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      backdrop-filter: blur(6px);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      animation: fadeInUp 0.5s ease both;
      animation-delay: var(--delay);
      cursor: default;
    }

    .reason-card:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border-color: rgba(180,120,255,0.25);
    }

    .reason-num {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      color: #9b6fd4;
      min-width: 28px;
      padding-top: 1px;
      font-style: italic;
    }

    .reason-text {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #ddc8f8;
      font-weight: 400;
    }
  </style>
</head>
<body>

  <div class="stars-container" id="stars"></div>
  <a href="index.html" class="back-btn">← back</a>

  <div class="header">
    <p class="header-label">✦ for sheryl ✦</p>
    <h1>100 reasons why <em>I like you</em></h1>
    <p class="header-sub">in no particular order, just how they came to me</p>
    <div class="divider"></div>
  </div>

  <div class="grid" id="reasonsGrid"></div>

      "the warmth you carry into every space you enter",
      "how you hold space for other people's feelings",
      "the way you push through even when things are tough",
      "you have standards for yourself that come from a real place",
      "your resilience",

      "the quiet loyalty you have toward the people you let in",
      "you're brave in ways you probably don't call brave",
      "how you show love in your own particular way",
      "the way you take up space",
      "you have a spirit that's genuinely hard to ignore",
      "how you make everything feel a little bit lighter",
      "the way you're tender with the things and people that matter",
      "you have a depth to you that takes time to see but is absolutely there",
      "how you've shaped the way I see things, just by being you",
      "the way you carry yourself through the unknown with a kind of quiet courage",
      "you're thoughtful in a way that feels rare these days",
      "how you love the things you love without embarrassment",
      "the way even your silences are comfortable",
      "you remind people what it means to be present",
      "how you take the ordinary and make it feel worth holding onto",
      "the way your personality stays consistent no matter who's around",
      "you give people a reason to be a little more open",
      "how the world genuinely feels better with you in it",
      "the way I think about things differently because of you",
      "just you, exactly as you are, all of it, you are the person i fell for",
    ];

    const grid = document.getElementById('reasonsGrid');
    reasons.forEach((text, i) => {
      const card = document.createElement('div');
      card.className = 'reason-card';
      card.style.setProperty('--delay', `${Math.min(i * 0.03, 2)}s`);
      card.innerHTML = `
        <span class="reason-num">${i + 1}.</span>
        <span class="reason-text">${text}</span>
      `;
      grid.appendChild(card);
    });

    // Stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 100; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = `
        width: ${size}px; height: ${size}px;
        top: ${Math.random() * 100}%; left: ${Math.random() * 100}%;
        --dur: ${Math.random() * 3 + 2}s;
        --delay: ${Math.random() * 4}s;
      `;
      starsEl.appendChild(s);
    }
  </script>
</body>
</html>
